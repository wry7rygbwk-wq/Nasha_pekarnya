const cat=document.querySelector('#cat'),room=document.querySelector('#room'),speech=document.querySelector('#speech');let busy=false;
function blink(){if(busy||document.hidden)return;busy=true;cat.classList.add('is-blinking');setTimeout(()=>{cat.classList.remove('is-blinking');busy=false},190)}
function blinkLoop(){setTimeout(()=>{blink();blinkLoop()},2500+Math.random()*3000)}blinkLoop();
function hearts(n=1){for(let i=0;i<n;i++){const el=document.createElement('span');el.className='heart';el.textContent=['♥','❤','♥'][Math.floor(Math.random()*3)];el.style.setProperty('--x',(23+Math.random()*54)+'%');el.style.setProperty('--y',(42+Math.random()*29)+'%');el.style.setProperty('--dx',(Math.random()*130-65)+'px');el.style.setProperty('--size',(17+Math.random()*14)+'px');el.style.setProperty('--time',(2.2+Math.random()*1.5)+'s');room.append(el);setTimeout(()=>el.remove(),4000)}}
setInterval(()=>{if(!document.hidden)hearts()},1100);
const petPhrases=[
  'Мррр… Ещё погладь! ♡',
  'МиМиМи МурМурМур',
  'Люблю Кошкинса!!',
  'Кось, погладь еще',
  'Люблю люблю тебя!',
  'Давай ещё'
];
let lastPetPhrase=-1;
cat.addEventListener('click',()=>{
  hearts(9);
  blink();
  let next=Math.floor(Math.random()*(petPhrases.length-1));
  if(next>=lastPetPhrase)next++;
  lastPetPhrase=next;
  speech.textContent=petPhrases[next];
});
